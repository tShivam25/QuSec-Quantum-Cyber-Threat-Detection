[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qusec"
version = "0.2.4"
description = "Quantum Security Framework for Quantum Digital Signature Threat Detection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "qiskit~=2.5",
    "qiskit-aer~=0.17",
    "rich~=15.0",
    "pyserial~=3.5",
    "websockets~=17.0",
    "cryptography>=42.0.0"
]
authors = [
    { name = "QuSec Developers" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Security :: Cryptography"
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1"
]
hardware = [
    "qiskit-ibm-runtime~=0.50"
]

[project.urls]
"Homepage" = "https://github.com/tShivam25/Quantum-Channel-Monitoring-System"
"Repository" = "https://github.com/tShivam25/Quantum-Channel-Monitoring-System"

[project.scripts]
qusec = "qusec.cli:main"
qusec-attacker = "qusec.attacker:main"

[tool.setuptools.packages.find]
where = ["QuSec/src", "src"]

[tool.pytest.ini_options]
pythonpath = ["QuSec/src", "src"]
testpaths = ["QuSec/tests", "tests"]
